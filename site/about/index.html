      <h3>ДЛЯ ЧЕГО ?</h3>
      <p>Всегда интересно собирать людей, с которыми можно всерьёз поговорить о том, что происходит в <br>
        нашей жизни: о мышлении и культуре, о технологиях и новациях, о настоящем и будущем человека. <br>
        Не просто обмениваться мнениями, а вместе разбираться, спорить и открывать неожиданные связи. <br>
        Ведь настоящее мышление всегда диалогично.</p>
      <p>Как говорил Михаил Бахтин: "У человека нет внутренней суверенной территории, он весь и всегда на <br>
        границе, смотря на себя, он смотрит в глаза другого или глазами другого."</p>
      <p>Поэтому так важно разговаривать и смотреть в правильные живые глаза.</p>
      <h3>ДЛЯ КОГО ?</h3>
      <p>Клуб открыт для людей с самыми разными интересами и опытом: важно одно — любопытство, <br>
        готовность думать самостоятельно и делиться собственными наблюдениями.</p>

        <div class="denis-copy">
          <p>Я занимаюсь теорией мышления, культурной антропологией, <br>
            семиотикой и методологией проектной деятельности; а также создаю <br>
            живописные работы, пишу книги и эссе, читаю лекции, разрабатываю <br>
            концепции и проекты.</p>
          <p>На первый взгляд, занятия довольно разные. Но меня всегда <br>
            интересовало то, что происходит на их пересечении: между мифологией <br>
            и наукой, историей и современностью, личным и глобальным.</p>
          <p>Иногда мысль требует образа, иногда образ приводит к исследованию, <br>
            а иногда всё это превращается в реальный проект или инструмент. <br>
            Так что я стараюсь не просто размышлять о происходящих переменах, <br>
            но и участвовать в них — создавать новые способы мыслить, творить и <br>
            воплощать задуманное.</p>
